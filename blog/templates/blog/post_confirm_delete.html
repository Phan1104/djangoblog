{% extends "blog/base.html" %}

{% block title %}
Delete Post
{% endblock %}

{% block content %}

<div class="container mt-5">

    <h1>Delete Post</h1>

    <p>
        Are you sure you want to delete
        "<strong>{{ object.title }}</strong>"?
    </p>

    <form method="post">
        {% csrf_token %}

        <button type="submit" class="btn btn-danger">
            Delete
        </button>

        <a href="{% url 'post_detail' object.slug %}"
           class="btn btn-secondary">
            Cancel
        </a>
    </form>

</div>

{% endblock %}
